<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرباح - إدارة العملاء</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial}
body{margin:0;background:#f1f5f9;color:#111}
header{background:#0f172a;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;opacity:.8;font-size:13px}
.container{max-width:900px;margin:auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f8fafc;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:#64748b}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin:5px 0;font-size:15px}
button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer}
.btn-main{background:#16a34a;color:#fff;width:100%}
.btn-dark{background:#0f172a;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.client{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:8px 0}
.client h3{margin:0 0 6px}
.client small{color:#64748b}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:12px;background:#fee2e2;color:#991b1b}
.badge.ok{background:#dcfce7;color:#166534}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:99}
.flex{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>
<header><h1>💰 أرباح</h1><p>إدارة العملاء والموردين - مربوط بجوجل شيت</p></header>
<div class="container">
<div class="card stats">
<div class="stat"><b id="totalClients">0</b><span>إجمالي العملاء</span></div>
<div class="stat"><b id="totalMoney">0</b><span>إجمالي المبالغ</span></div>
<div class="stat"><b id="totalDue">0</b><span>مستحق</span></div>
</div>
<div class="card">
<h3 style="margin:0 0 8px">➕ إضافة عميل / مورد جديد</h3>
<input id="cName" placeholder="اسم العميل">
<input id="cPhone" placeholder="رقم التليفون">
<input id="cAmount" type="number" placeholder="المبلغ">
<input id="cDate" type="date">
<input id="cNote" placeholder="ملاحظة">
<button class="btn-main" onclick="addSupplier()">💾 حفظ العميل</button>
</div>
<div class="card">
<div class="flex">
<h3 style="margin:0">📋 قائمة العملاء</h3>
<button class="btn-dark" onclick="loadFromSheet()">🔄 تحديث من جوجل شيت</button>
</div>
<input id="search" oninput="filterClients()" placeholder="🔍 ابحث بالاسم أو الرقم...">
<div id="dueBox"></div>
<div id="list"></div>
</div>
<div class="card">
<h3 style="margin:0 0 8px">⚙️ الإعدادات</h3>
<input id="setShop" placeholder="اسم المحل">
<input id="setPass" placeholder="باسورد الأدمن">
<button class="btn-dark" onclick="saveSettings()">حفظ الإعدادات</button>
<div id="settingsPreview" style="font-size:13px;color:#475569;margin-top:8px"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
// ===== الإضافة 1 : الربط بجوجل شيت =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyxQqIOmfrkMjdGCZZNKOTwRCP1jhdvTWXJfKLUCax78QcJroTnR4pzm3HvuRjU392J/exec";
let ADMIN_PASS = localStorage.getItem('arbah_pass') || "1234";
let suppliers = JSON.parse(localStorage.getItem('arbah_v11') || "[]");
let settings = JSON.parse(localStorage.getItem('arbah_settings') || "{}");
let isSyncing = false;
let filtered = suppliers;

function showToast(msg){
  let t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=> t.style.display='none', 2500);
}

async function syncToSheet(){
  if(isSyncing) return; isSyncing = true;
  try{
    await fetch(SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'save', suppliers: suppliers, settings: settings, adminPass: ADMIN_PASS})
    });
  }catch(e){ console.log('sync fail', e); }
  isSyncing = false;
}

async function loadFromSheet(){
  try{
    showToast('⏳ جاري التحميل من جوجل...');
    let r = await fetch(SCRIPT_URL + '?action=load');
    let d = await r.json();
    if(d && d.suppliers){
      suppliers = d.suppliers;
      if(d.settings) settings = d.settings;
      if(d.adminPass) ADMIN_PASS = d.adminPass;
      localStorage.setItem('arbah_v11', JSON.stringify(suppliers));
      localStorage.setItem('arbah_settings', JSON.stringify(settings));
      save();
      showToast('✅ تم تحميل البيانات من جوجل شيت');
    } else {
      showToast('⚠️ الشيت فاضي، هرفع اللي عندك');
      syncToSheet();
    }
  }catch(e){ showToast('❌ مش قادر أوصل لجوجل'); }
}

// ===== الإضافة 2 : دالة الحفظ الجديدة =====
function save(){
  localStorage.setItem('arbah_v11', JSON.stringify(suppliers));
  renderList(); updateStats(); filterClients(); checkDue(); updateSettingsPreview();
  syncToSheet();
}
  function addSupplier(){
  let name = document.getElementById('cName').value.trim();
  let phone = document.getElementById('cPhone').value.trim();
  let amount = parseFloat(document.getElementById('cAmount').value || 0);
  let date = document.getElementById('cDate').value;
  let note = document.getElementById('cNote').value.trim();
  if(!name){ showToast('اكتب الاسم الأول'); return; }
  suppliers.unshift({id: Date.now(), name, phone, amount, date, note, paid: false});
  document.getElementById('cName').value='';
  document.getElementById('cPhone').value='';
  document.getElementById('cAmount').value='';
  document.getElementById('cNote').value='';
  save();
  showToast('✅ تم الحفظ');
}

function deleteSupplier(id){
  if(!confirm('متأكد تحذف العميل ده؟')) return;
  suppliers = suppliers.filter(s => s.id != id);
  save();
}

function togglePaid(id){
  let s = suppliers.find(x => x.id == id);
  if(s) s.paid = !s.paid;
  save();
}

function renderList(){
  let box = document.getElementById('list');
  let data = filtered.length ? filtered : suppliers;
  if(!data.length){ box.innerHTML='<p style="text-align:center;color:#94a3b8">مفيش عملاء لسه</p>'; return; }
  box.innerHTML = data.map(s => `
  <div class="client">
    <div class="flex"><h3>${s.name}</h3><b>${s.amount} ج</b></div>
    <small>📞 ${s.phone || '-'} | 📅 ${s.date || '-'}<br>${s.note || ''}</small><br>
    <span class="badge ${s.paid ? 'ok' : ''}">${s.paid ? 'تم الدفع ✅' : 'مستحق ⚠️'}</span>
    <div class="row" style="margin-top:8px">
      <button class="btn-dark" onclick="togglePaid(${s.id})">${s.paid ? 'إلغاء الدفع' : 'تم الدفع'}</button>
      <button class="btn-red" onclick="deleteSupplier(${s.id})">حذف</button>
    </div>
  </div>`).join('');
}

function updateStats(){
  document.getElementById('totalClients').textContent = suppliers.length;
  let total = suppliers.reduce((a,s)=> a + (parseFloat(s.amount)||0), 0);
  let due = suppliers.filter(s=>!s.paid).reduce((a,s)=> a + (parseFloat(s.amount)||0), 0);
  document.getElementById('totalMoney').textContent = total + ' ج';
  document.getElementById('totalDue').textContent = due + ' ج';
}

function filterClients(){
  let q = document.getElementById('search').value.toLowerCase();
  filtered = suppliers.filter(s => (s.name||'').toLowerCase().includes(q) || (s.phone||'').includes(q));
  renderList();
}

function checkDue(){
  let due = suppliers.filter(s=>!s.paid);
  document.getElementById('dueBox').innerHTML = due.length ? `<div style="background:#fef3c7;padding:10px;border-radius:10px;margin:8px 0">⚠️ عندك ${due.length} عميل لسه مدفعش</div>` : '';
  }
  function loadSettings(){
  document.getElementById('setShop').value = settings.shop || '';
  document.getElementById('setPass').value = ADMIN_PASS || '';
  updateSettingsPreview();
}

function saveSettings(){
  settings.shop = document.getElementById('setShop').value;
  ADMIN_PASS = document.getElementById('setPass').value || ADMIN_PASS;
  localStorage.setItem('arbah_settings', JSON.stringify(settings));
  localStorage.setItem('arbah_pass', ADMIN_PASS);
  updateSettingsPreview(); syncToSheet();
  showToast('✅ تم حفظ الإعدادات');
}

function updateSettingsPreview(){
  document.getElementById('settingsPreview').textContent = 'المحل: ' + (settings.shop || '—') + ' | العملاء: ' + suppliers.length;
}

// ===== الإضافة 3 : التشغيل والتحميل من الشيت =====
loadSettings(); save(); loadFromSheet();
</script>
</body>
</html>
