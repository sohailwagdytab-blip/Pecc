<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PECC - متابعة المستخلص</title>
<style>
body{font-family:Arial;text-align:center;background:#f5f5f5;margin:0;padding:0}
header{background:#0b3d91;color:#fff;padding:15px}
header img{width:110px;height:auto;display:block;margin:0 auto 8px;border-radius:10px}
header h1{margin:5px 0;font-size:22px}
.box{background:#fff;margin:20px auto;padding:20px;max-width:420px;border-radius:12px;box-shadow:0 2px 10px #0001}
input{width:92%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;text-align:center}
button{background:#0b3d91;color:#fff;border:0;padding:12px 20px;border-radius:8px;font-size:16px;width:95%;cursor:pointer;margin-top:8px}
button.green{background:#1a7f37}
.result{margin-top:15px;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
td,th{border:1px solid #ddd;padding:8px}
</style>
</head>
<body>

<header>
<img src="logo.png" alt="PECC">
<h1>PECC - تتبع المستخلص</h1>
<p>تابع مستخلصك برقم التليفون ورقم الهوية</p>
</header>

<!-- بحث المورد -->
<div class="box">
<h2>أنا مورد - تتبع مستخلصي</h2>
<input id="sPhone" placeholder="رقم التليفون">
<input id="sId" placeholder="آخر 5 أرقام من الهوية" maxlength="5">
<button onclick="searchSupplier()">بحث عن المستخلص</button>
<div class="result" id="searchResult"></div>
</div>

<!-- الإدارة -->
<div class="box">
<h2>الإدارة - إضافة مورد</h2>
<input id="aName" placeholder="اسم المورد - عادي أي اسم">
<input id="aPhone" placeholder="رقم التليفون">
<input id="aId" placeholder="آخر 5 أرقام من الهوية" maxlength="5">
<input id="aMostakhlas" placeholder="قيمة المستخلص / رابط المستخلص">
<button class="green" onclick="addSupplier()">حفظ المورد</button>
<div class="result" id="adminResult"></div>
<div id="list"></div>
</div>

<script>
let suppliers = JSON.parse(localStorage.getItem('suppliers') || '[]');
showList();

function addSupplier(){
  let name = document.getElementById('aName').value.trim();
  let phone = document.getElementById('aPhone').value.trim();
  let idLast5 = document.getElementById('aId').value.trim();
  let mostakhlas = document.getElementById('aMostakhlas').value.trim();
  if(!name || !phone || !idLast5 || !mostakhlas){
    document.getElementById('adminResult').innerText = 'اكتب كل البيانات';
    return;
  }
  suppliers.push({name, phone, idLast5, mostakhlas});
  localStorage.setItem('suppliers', JSON.stringify(suppliers));
  document.getElementById('adminResult').innerText = 'تم حفظ ' + name + ' بنجاح';
  showList();
}

function searchSupplier(){
  let phone = document.getElementById('sPhone').value.trim();
  let idLast5 = document.getElementById('sId').value.trim();
  let found = suppliers.find(s => s.phone === phone && s.idLast5 === idLast5);
  let el = document.getElementById('searchResult');
  if(found){
    el.innerHTML = 'أهلاً ' + found.name + '<br>مستخلصك: ' + found.mostakhlas;
  } else {
    el.innerText = 'رقم التليفون أو رقم الهوية غير صحيح';
  }
}

function showList(){
  if(suppliers.length === 0){ document.getElementById('list').innerHTML=''; return; }
  let h = '<table><tr><th>الاسم</th><th>التليفون</th><th>الهوية</th></tr>';
  suppliers.forEach(s=>{ h += '<tr><td>'+s.name+'</td><td>'+s.phone+'</td><td>'+s.idLast5+'</td></tr>'; });
  h += '</table>';
  document.getElementById('list').innerHTML = h;
}
</script>
</body>
</html>
